name: build

# Builds standalone apps for macOS and Windows. PyInstaller cannot
# cross-compile, so each runs on its own OS. validate.py needs no hardware,
# which means CI can actually verify the protocol decode, not just that it
# compiles.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: NXOSC_Reborn-macos
          - os: windows-latest
            artifact: NXOSC_Reborn-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify the protocol decode against recorded Nxosc output
        run: python validate.py

      - name: Verify the packet decode against recorded raw packets
        run: python analyze.py

      - name: Build
        run: pyinstaller --noconfirm --clean NXOSC_Reborn.spec

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
