name: build

# Builds standalone apps for macOS and Windows. PyInstaller cannot
# cross-compile, so each runs on its own OS. validate.py and analyze.py need
# no hardware, so CI verifies the protocol decode rather than just that it
# compiles.
#
# Pushing a tag like v0.9.0 also publishes a Release with both builds
# attached.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: NXOSC-Reborn-macOS
          - os: windows-latest
            artifact: NXOSC-Reborn-Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify the protocol decode against recorded Nxosc output
        run: python validate.py

      - name: Verify the packet decode against recorded raw packets
        run: python analyze.py

      - name: Build
        run: pyinstaller --noconfirm --clean NXOSC_Reborn.spec

      # Archive on the build machine. actions/upload-artifact does not keep
      # the executable bit or symlinks, which would quietly break a macOS
      # .app; ditto preserves both.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/NXOSC Reborn.app" "${{ matrix.artifact }}.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/NXOSC_Reborn -DestinationPath "${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh downloaded
          gh release create "${GITHUB_REF_NAME}" downloaded/*.zip \
            --title "NXOSC Reborn ${GITHUB_REF_NAME}" \
            --notes-file .github/RELEASE_NOTES.md \
            --prerelease
